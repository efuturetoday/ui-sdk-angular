name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.release.outputs['projects/core--release_created'] }}
      theme-default: ${{ steps.release.outputs['projects/themes/default--release_created'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  publish:
    name: Publish ${{ matrix.package.name }} to npm
    needs: release-please
    strategy:
      matrix:
        package:
          - name: "@ngx-ui-sdk/core"
            output: core
            build: build:lib
            dist: dist/core
          - name: "@ngx-ui-sdk/theme-default"
            output: theme-default
            build: build:theme
            dist: dist/theme-default
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm's trusted publishing: no token, and the package gets provenance.
      id-token: write
    steps:
      - if: needs.release-please.outputs[matrix.package.output] == 'true'
        uses: actions/checkout@v4
        with:
          submodules: true
      - if: needs.release-please.outputs[matrix.package.output] == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - if: needs.release-please.outputs[matrix.package.output] == 'true'
        run: npm ci
      - if: needs.release-please.outputs[matrix.package.output] == 'true'
        run: npm run ${{ matrix.package.build }}
      - if: needs.release-please.outputs[matrix.package.output] == 'true'
        run: npm publish --access public
        working-directory: ${{ matrix.package.dist }}
