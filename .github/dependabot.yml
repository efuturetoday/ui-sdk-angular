version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "ng-packagr"]
      dev:
        dependency-type: development
        exclude-patterns: ["@angular/*", "@angular-devkit/*", "ng-packagr"]
    # ui-sdk updates come with its submodule and its specs, by hand.
    ignore:
      - dependency-name: "@ui-sdk/core"
      # Angular sets the TypeScript range, so it moves with Angular.
      - dependency-name: "typescript"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
