name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # One release for both packages, with one version.
      created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  publish:
    name: Publish ${{ matrix.package.name }} to npm
    needs: release-please
    strategy:
      matrix:
        package:
          - name: "@ngx-ui-sdk/core"
            build: build:lib
            dist: dist/core
          - name: "@ngx-ui-sdk/themes"
            build: build:themes
            dist: dist/themes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm's trusted publishing: no token, and the package gets provenance.
      id-token: write
    steps:
      - if: needs.release-please.outputs.created == 'true'
        uses: actions/checkout@v7
        with:
          submodules: true
      - if: needs.release-please.outputs.created == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - if: needs.release-please.outputs.created == 'true'
        run: npm ci
      - if: needs.release-please.outputs.created == 'true'
        run: npm run ${{ matrix.package.build }}
      - if: needs.release-please.outputs.created == 'true'
        run: npm publish --access public
        working-directory: ${{ matrix.package.dist }}
